name: Bug report
description: Report a reproducible Rasputin problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before posting, remove tokens, credentials, private prompts, workspace content, and sensitive paths.
  - type: input
    id: version
    attributes:
      label: Rasputin version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows and hardware
      description: Windows version, CPU, GPU, and VRAM
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include exact error text after removing private information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Enter numbered steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model details
      description: Model ID, GGUF filename or quantization, and load settings when relevant
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and private workspace content.
          required: true
