name: Windows installer

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      store_submission:
        type: boolean
        default: false
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    environment: ${{ inputs.release && 'release' || 'build' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate Store build inputs before installing dependencies
        env:
          STORE_PACKAGE_MODE: ${{ inputs.store_submission && 'submission' || 'test' }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          SIGNED_RELEASE: ${{ inputs.release }}
        shell: pwsh
        run: |
          if ($env:SIGNED_RELEASE -eq 'true' -and $env:STORE_PACKAGE_MODE -eq 'submission') {
            throw 'Choose either an NSIS signed release or a Store submission build, not both.'
          }
          if (($env:SIGNED_RELEASE -eq 'true' -or $env:STORE_PACKAGE_MODE -eq 'submission') -and
              ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch')) {
            throw 'Release and Store submission packages require a manual run on main.'
          }
          node -e "require('./scripts/store-config.cjs').createStoreConfig()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Validate release prerequisites
        if: inputs.release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD -or -not $env:PUBLISHER_NAME) {
            throw 'Signed releases require CSC_LINK, CSC_KEY_PASSWORD and WINDOWS_PUBLISHER_NAME in the release environment.'
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable releases require a stable x.y.z package version.' }

      - name: Build unsigned CI installer
        if: '!inputs.release'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: npm run desktop:package

      - name: Build signed release installer
        if: inputs.release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: npm run desktop:package -- --config.forceCodeSigning=true "--config.win.publisherName=$env:PUBLISHER_NAME"

      - name: Verify packaged application and updater assets
        env:
          EXPECT_SIGNED: ${{ inputs.release }}
          PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          node scripts/verify-update-artifacts.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-packaged-desktop.cjs dist/electron/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:EXPECT_SIGNED -eq 'true') {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            foreach ($file in @("dist/electron/Rasputin-Setup-$version.exe", 'dist/electron/win-unpacked/Rasputin.exe')) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $file" }
              if ($signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne $env:PUBLISHER_NAME) {
                throw "Unexpected Authenticode publisher: $file"
              }
            }
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = "dist/electron/Rasputin-Setup-$($package.version).exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing $installer" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii
          Copy-Item -LiteralPath $installer -Destination "dist/electron/Rasputin-Setup.exe"
          "$hash  Rasputin-Setup.exe" | Set-Content -LiteralPath "dist/electron/Rasputin-Setup.exe.sha256" -Encoding ascii

      - name: Build and verify Microsoft Store package
        if: '!inputs.release'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          STORE_PACKAGE_MODE: ${{ inputs.store_submission && 'submission' || 'test' }}
        shell: pwsh
        run: |
          node scripts/store-config.cjs "$env:RUNNER_TEMP/rasputin-store.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/prepare-store-assets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --prepackaged dist/electron/win-unpacked --win appx --x64 --publish never --config "$env:RUNNER_TEMP/rasputin-store.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-store-package.ps1 -PackagePath "dist/electron/Rasputin-$env:STORE_PACKAGE_MODE-$version-x64.appx" -ConfigPath "$env:RUNNER_TEMP/rasputin-store.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @"
          ### Windows test packages
          Source commit: $env:GITHUB_SHA
          - NSIS artifact: download and manually install for personal testing; unsigned, no automatic updates.
          - AppX mode: **$env:STORE_PACKAGE_MODE**. Unsigned; Store signs submission packages after certification.
          - Test identity packages are packaging rehearsals, not Store submissions or directly installable signed packages.
          - For Store auto-updates, complete Partner Center setup and submit to a private audience first.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Store package and provenance
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.store_submission && 'rasputin-store-submission' || 'rasputin-store-test-package' }}
          path: |
            dist/electron/*.appx
            dist/electron/*.appx.sha256
            dist/electron/*.appx.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasputin-windows-installer
          path: |
            dist/electron/Rasputin-Setup-*.exe
            dist/electron/Rasputin-Setup-*.exe.sha256
            dist/electron/Rasputin-Setup.exe
            dist/electron/Rasputin-Setup.exe.sha256
            dist/electron/latest.yml
            dist/electron/*.blockmap
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
