<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img"><title>Measured contrast versus the 4.5 to 1 threshold</title><rect width="1000" height="310" fill="#ffffff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="36" font-size="21" font-weight="700" fill="#172D35">Why the light-mode inspector is hard to read</text><text x="28" y="90" font-size="17" fill="#172D35">Recovery heading</text><rect x="270" y="73" width="550" height="21" rx="3" fill="#EFF4F2"/><rect x="270" y="73" width="112.2" height="21" rx="3" fill="#AF422C"/><text x="397.2" y="90" font-size="17" fill="#AF422C">1.02:1</text><text x="28" y="145" font-size="17" fill="#172D35">Model name</text><rect x="270" y="128" width="550" height="21" rx="3" fill="#EFF4F2"/><rect x="270" y="128" width="115.5" height="21" rx="3" fill="#AF422C"/><text x="400.5" y="145" font-size="17" fill="#AF422C">1.05:1</text><text x="28" y="200" font-size="17" fill="#172D35">Selected tab</text><rect x="270" y="183" width="550" height="21" rx="3" fill="#EFF4F2"/><rect x="270" y="183" width="139.7" height="21" rx="3" fill="#AF422C"/><text x="424.7" y="200" font-size="17" fill="#AF422C">1.27:1</text><line x1="765" y1="62" x2="765" y2="216" stroke="#216957" stroke-width="2" stroke-dasharray="5 4"/><text x="690" y="247" font-size="17" font-weight="700" fill="#216957">4.5:1 required</text><text x="28" y="284" font-size="15" fill="#51656D">Measured in visible Electron 0.3.2. Larger contrast ratios mean more readable text.</text></g></svg>