<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="312" viewBox="0 0 1000 312" role="img"><title>Five major fixes and three follow-ups</title><rect width="1000" height="312" fill="#ffffff"/><g font-family="Segoe UI,Arial,sans-serif"><text x="28" y="34" font-size="21" font-weight="700" fill="#172D35">What needs attention</text><text x="28" y="65" font-size="15" fill="#51656D">Fix the barriers to use before spending time on cosmetic changes.</text><circle cx="45" cy="113" r="17" fill="#AF422C"/><text x="40" y="119" fill="#fff" font-size="16" font-weight="700">1</text><text x="28" y="153" font-size="16" fill="#172D35">Light-mode text</text><circle cx="238" cy="113" r="17" fill="#AF422C"/><text x="233" y="119" fill="#fff" font-size="16" font-weight="700">2</text><text x="221" y="153" font-size="16" fill="#172D35">Shared contrast</text><circle cx="431" cy="113" r="17" fill="#AF422C"/><text x="426" y="119" fill="#fff" font-size="16" font-weight="700">3</text><text x="414" y="153" font-size="16" fill="#172D35">Control labels</text><circle cx="624" cy="113" r="17" fill="#AF422C"/><text x="619" y="119" fill="#fff" font-size="16" font-weight="700">4</text><text x="607" y="153" font-size="16" fill="#172D35">Keyboard scrolling</text><circle cx="817" cy="113" r="17" fill="#AF422C"/><text x="812" y="119" fill="#fff" font-size="16" font-weight="700">5</text><text x="800" y="153" font-size="16" fill="#172D35">Folder tree</text><text x="28" y="192" font-size="15" font-weight="700" fill="#AF422C">5 MAJOR FIXES</text><line x1="28" y1="208" x2="970" y2="208" stroke="#D8E1DF"/><text x="28" y="249" font-size="17" fill="#976419">6  Honor reduced motion</text><text x="345" y="249" font-size="17" fill="#976419">7  Measure startup cost</text><text x="662" y="249" font-size="17" fill="#976419">8  Update login copy</text><text x="28" y="284" font-size="15" fill="#51656D">3 FOLLOW-UPS   |   No P0 task-blocking issue established in the tested states</text></g></svg>